name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      HAS_MODULES_TOKEN: ${{ secrets.MODULES_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Read version
        id: ver
        run: |
          code=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" app/build.gradle)
          name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          "$JAVA_HOME/bin/keytool" -importkeystore \
            -srckeystore "$RUNNER_TEMP/ks.jks" -srcstoretype JKS -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" \
            -destkeystore "$RUNNER_TEMP/release.p12" -deststoretype PKCS12 -deststorepass "$KEYSTORE_PASSWORD" \
            -destalias "$KEY_ALIAS" -destkeypass "$KEY_PASSWORD" -noprompt
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build (signed release if key present, else debug)
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk StatusBack-${{ steps.ver.outputs.name }}.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk StatusBack-${{ steps.ver.outputs.name }}-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: StatusBack-apk
          path: StatusBack-*.apk

      - name: Verify APK is signed
        if: env.KEYSTORE_FILE != ''
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          f = sorted(glob.glob("StatusBack-*.apk"))[0]
          z = zipfile.ZipFile(f)
          sig = [n for n in z.namelist() if n.startswith("META-INF/") and n.endswith((".SF", ".RSA", ".SIG", ".p7s"))]
          print("%s: entries=%d sig=%s eocd_comment=%d" % (f, len(z.namelist()), sig, len(z.comment or b"")))
          sys.exit(0 if (sig or z.comment) else 1)
          PY

      - name: GitHub release (tag push, signed build only)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" StatusBack-*.apk \
            --title "${{ steps.ver.outputs.name }}" --generate-notes

      - name: Publish to Xposed Module Repository (optional)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_FILE != '' && env.HAS_MODULES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.code }}-${{ steps.ver.outputs.name }}" StatusBack-*.apk \
            --repo Xposed-Modules-Repo/io.github.fragtion.statusback \
            --title "${{ steps.ver.outputs.name }}" \
            --notes "${{ steps.ver.outputs.name }} - see https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
